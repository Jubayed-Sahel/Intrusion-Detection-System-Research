name: Research integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned environment
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Verify current research artifacts and manuscripts
        run: python -B verify_research_closeout.py
      - name: Verify historical research artifacts
        run: python -B verify_outputs.py
      - name: Verify expanded model-seed evidence
        run: python -B verify_research_validation.py
      - name: Verify clean-environment evidence
        run: python -B verify_research_validation.py --output outputs/clean_reproduction
